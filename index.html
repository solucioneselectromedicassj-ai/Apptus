body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
html{overscroll-behavior:none}
input,select,textarea{-webkit-appearance:none;border-radius:8px}
.btn{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.eqli,.opt,.chk,.cat-card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.back{touch-action:manipulation;min-height:44px;min-width:44px;display:inline-flex;align-items:center}
#app{padding-bottom:env(safe-area-inset-bottom,0)}
.w{padding-bottom:calc(16px + env(safe-area-inset-bottom,0))}
@media (display-mode:standalone){body{padding-top:env(safe-area-inset-top,0)}}
.w{max-width:500px;margin:0 auto;padding:16px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.muted{color:var(--mu);font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;margin-top:8px}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bds);background:var(--card2);color:var(--tx);font-size:14px;margin-bottom:4px;outline:none;-webkit-appearance:none}
.btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-g{background:transparent;border:.5px solid var(--bds);color:var(--mu);font-size:12px}
.btn-ok{background:var(--ok);color:#fff}
.back{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;margin-bottom:12px;padding:0}
.prog{background:var(--bd);border-radius:3px;height:4px}
.pf{height:4px;border-radius:3px;transition:width .3s}
.srow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sn{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;margin-top:1px}
.st{font-size:14px;line-height:1.55}
.sd{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.45}
.tip{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55;border-width:1px;border-style:solid}
.tw{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.ts{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.td{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.chk{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:.5px solid var(--bd);transition:all .15s}
.chk.done{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt{background:var(--card2);border:1.5px solid var(--bd);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;transition:all .2s}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.ol{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.eqli{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;margin-bottom:8px;background:var(--card);border:.5px solid var(--bd)}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;background:var(--card2);border:.5px solid var(--bd);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.sc{background:var(--card);border:.5px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.urow{padding:10px 12px;border-radius:8px;margin-bottom:6px;border:.5px solid var(--bd);background:var(--card2)}
.iimg{position:relative;user-select:none;-webkit-user-select:none}
.iimg img{width:100%;border-radius:8px;display:block}
.hdr-at{background:linear-gradient(135deg,#1a3a6b,#0f2548);padding:14px 16px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.cat-card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;gap:14px;align-items:flex-start}
.cat-card:active{opacity:.8}
.cat-icon{font-size:32px;min-width:40px;text-align:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.watermark{position:fixed;bottom:0;left:0;right:0;pointer-events:none;z-index:9999;text-align:center;padding:4px;font-size:10px;color:rgba(255,255,255,0.18);letter-spacing:1px;user-select:none}
@media print{body::before{content:'COPIA NO AUTORIZADA - AppTus';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);font-size:60px;color:rgba(200,0,0,0.3);z-index:9999;pointer-events:none;}}.no-capture{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style>

function makeIcon(sz){
 var c=document.createElement('canvas');c.width=c.height=sz;
 var x=c.getContext('2d');if(!x)return null;
 var r=sz*0.18;
 x.beginPath();x.moveTo(r,0);x.lineTo(sz-r,0);x.quadraticCurveTo(sz,0,sz,r);
 x.lineTo(sz,sz-r);x.quadraticCurveTo(sz,sz,sz-r,sz);
 x.lineTo(r,sz);x.quadraticCurveTo(0,sz,0,sz-r);
 x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);x.closePath();
 x.fillStyle='#1a3a6b';x.fill();
 var s=sz/100;
 x.strokeStyle='rgba(255,255,255,0.9)';x.lineWidth=3.5*s;x.lineJoin='round';
 x.beginPath();x.moveTo(50*s,17*s);x.lineTo(74*s,29*s);x.lineTo(74*s,53*s);
 x.bezierCurveTo(74*s,68*s,63*s,75*s,50*s,82*s);
 x.bezierCurveTo(37*s,75*s,26*s,68*s,26*s,53*s);
 x.lineTo(26*s,29*s);x.closePath();x.stroke();
 x.strokeStyle='#22c55e';x.lineWidth=4.5*s;x.lineCap='round';x.lineJoin='round';
 x.beginPath();x.moveTo(35*s,51*s);x.lineTo(45*s,61*s);x.lineTo(66*s,39*s);x.stroke();
 return c.toDataURL('image/png');
}

async function apiPost(action, data){
 try{
  var r=await fetch(API+'?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  return await r.json();
 }catch(e){return{ok:false,error:String(e)};}
}
async function apiGet(action, params){
 try{
  var p=new URLSearchParams(params||{});

  return await r.json();
 }catch(e){return{ok:false,error:String(e)};}
}

function getMQ(modId,mIdx){

 for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
 return a.slice(0,Math.min(n,a.length));
}

// getModData: checks cache → embedded fallback
function getModData(modId){
 // Check runtime cache first (loaded from Supabase)
 if(S.modulCache[modId]){
  var c=S.modulCache[modId];
  return {mods:c.mods||[],quiz:c.quiz||[],mq:c.mq||{},zonas:c.zonas||[],keys:c.keys_data||[],version:c.version||1};
 }
 // Check localStorage cache with version check
 try{
  var cached=localStorage.getItem('at_mod_'+modId);
  if(cached){
   var c=JSON.parse(cached);
   S.modulCache[modId]=c;
   return {mods:c.mods||[],quiz:c.quiz||[],mq:c.mq||{},zonas:c.zonas||[],keys:c.keys_data||[],version:c.version||1};
  }
 }catch(e){}
 // Embedded fallback
 var MQB=typeof MQ!=='undefined'?MQ:{};
 var maps={
  'se3':{mods:typeof MODS_SE3!=='undefined'?MODS_SE3:[],quiz:typeof QUIZ_SE3!=='undefined'?QUIZ_SE3:[],mq:MQB.se3||{}},
  's5':{mods:typeof MODS_S5!=='undefined'?MODS_S5:[],quiz:typeof QUIZ_S5!=='undefined'?QUIZ_S5:[],mq:typeof MQ_S5!=='undefined'?MQ_S5:{}},
  'dfm100':{mods:typeof MODS_DFM100!=='undefined'?MODS_DFM100:[],quiz:typeof QUIZ_DFM100!=='undefined'?QUIZ_DFM100:[],mq:MQB.dfm100||{}},
  'iram9808':{mods:typeof MODS_IRAM9808!=='undefined'?MODS_IRAM9808:[],quiz:typeof QUIZ_IRAM9808!=='undefined'?QUIZ_IRAM9808:[],mq:MQB.iram9808||{}},
  'hs_basico':{mods:typeof MODS_HS!=='undefined'?MODS_HS:[],quiz:typeof QUIZ_HS!=='undefined'?QUIZ_HS:[],mq:MQB.hs||{}},'mindray_d3':{mods:typeof MODS_D3!=='undefined'?MODS_D3:[],quiz:typeof QUIZ_D3!=='undefined'?QUIZ_D3:[],mq:typeof MQ_D3!=='undefined'?MQ_D3:{}},'cardiomax':{mods:typeof MODS_CM!=='undefined'?MODS_CM:[],quiz:typeof QUIZ_CM!=='undefined'?QUIZ_CM:[],mq:typeof MQ_CM!=='undefined'?MQ_CM:{}},'nihon_kohden':{mods:typeof MODS_NK!=='undefined'?MODS_NK:[],quiz:typeof QUIZ_NK!=='undefined'?QUIZ_NK:[],mq:typeof MQ_NK!=='undefined'?MQ_NK:{}},'em_c12':{mods:typeof MODS_EMC12!=='undefined'?MODS_EMC12:[],quiz:typeof QUIZ_EMC12!=='undefined'?QUIZ_EMC12:[],mq:typeof MQ_EMC12!=='undefined'?MQ_EMC12:{}},
 };
 return maps[modId]||null;
}

// Load modules from Supabase in background after login

async function runMigration(){
var CATS=getCats();
 var btn=event&&event.target;
 if(btn){btn.textContent='Sincronizando...';btn.disabled=true;}
 var ids=['se3','dfm100','s5','mindray_d3','cardiomax','nihon_kohden','em_c12','iram9808','hs_basico'];
 var ok=0,fail=0;
 for(var i=0;i<ids.length;i++){
  var d=getModData(ids[i]);
  if(!d||!d.mods||!d.mods.length){fail++;continue;}
  var catInfo=null;
  for(var ci=0;ci<CATS.length;ci++){
   for(var mi=0;mi<CATS[ci].modulos.length;mi++){
    if(CATS[ci].modulos[mi].id===ids[i]){catInfo=CATS[ci].modulos[mi];break;}
   }
  }
  var payload={
   pw:'SEM2026super',
   id:ids[i],
   nombre:catInfo?catInfo.label:ids[i],
   icono:catInfo?catInfo.icon:'📋',
   categoria:'equipos',
   sub:catInfo?catInfo.sub:'',
   color:catInfo&&catInfo.color?catInfo.color:'#1a3a6b',
   mods:d.mods,
   quiz:d.quiz,
   mq:d.mq,
   version:1,
   activo:true
  };
  var res=await apiPost('upsert_modulo',payload);
  if(res&&res.ok)ok++;else fail++;
 }
 if(btn){btn.textContent='☁ Sincronizar modulos a la nube';btn.disabled=false;}
 alert('Sincronizacion completada!\n\nSubidos: '+ok+'\nErrores: '+fail+'\n\nLos modulos ya estan en la nube. Los usuarios los cargaran automaticamente al abrir la app.');
}

async function syncModulos(modIds){
 if(!modIds||!modIds.length)return;
 // Build version map from local cache
 var versionMap={};
 for(var i=0;i<modIds.length;i++){
  try{var v=localStorage.getItem('at_mod_ver_'+modIds[i]);if(v)versionMap[modIds[i]]=parseInt(v);}catch(e){}
 }
 try{
  var qp='ids='+modIds.join(',')+'&versions='+encodeURIComponent(JSON.stringify(versionMap));
  var res=await apiGet('modulos?'+qp,{});
  if(res.ok&&res.modulos){
   for(var id in res.modulos){
    var m=res.modulos[id];
    S.modulCache[id]=m;
    try{localStorage.setItem('at_mod_'+id,JSON.stringify(m));localStorage.setItem('at_mod_ver_'+id,String(m.version||1));}catch(e){}
   }
   if(S.screen==='home')render();
  }
 }catch(e){}
}

// Upload local module to Supabase (super-admin migration tool)
async function uploadModuloToSupabase(modId){
var CATS=getCats();
 var d=getModData(modId);
 if(!d)return;
 var catInfo=null;
 for(var i=0;i<CATS.length;i++){
  for(var j=0;j<CATS[i].modulos.length;j++){
   if(CATS[i].modulos[j].id===modId)catInfo=CATS[i].modulos[j];
  }
 }
 if(!catInfo)return;
 var payload={
  pw:'SEM2026super',
  id:modId,
  nombre:catInfo.label,
  icono:catInfo.icon,
  categoria:CATS.filter(function(c){return c.modulos.some(function(m){return m.id===modId;})})[0]&&CATS.filter(function(c){return c.modulos.some(function(m){return m.id===modId;})})[0].id||'equipos',
  sub:catInfo.sub,
  color:catInfo.color||'#1a3a6b',
  mods:d.mods,
  quiz:d.quiz,
  mq:d.mq,
 };
 var res=await apiPost('upsert_modulo',payload);
 return res;
}

// Migrate ALL embedded modules to Supabase (run once from super-admin)
async function migrateAllModulos(){
 var ids=['se3','dfm100','s5','mindray_d3','cardiomax','nihon_kohden','em_c12','iram9808','hs_basico'];
 var results=[];
 for(var i=0;i<ids.length;i++){
  var r=await uploadModuloToSupabase(ids[i]);
  results.push({id:ids[i],ok:r&&r.ok});
 }
 alert('Migracion completada:\n'+results.map(function(r){return r.id+': '+(r.ok?'OK':'ERROR');}).join('\n'));
 return results;
}

function getMQ(sId,eId,mIdx){var bank=(MQ[eId]&&MQ[eId][mIdx])||[];var n=(MQ_N[eId]&&MQ_N[eId][mIdx])||3;var a=bank.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a.slice(0,Math.min(n,a.length));}

function exportCSV(){
 var ad=S.adminEmpresaData;if(!ad)return;
 var users=ad.usuarios||[],progress=ad.progreso||[],sols=ad.solicitudes||[];
 var rows=[['Nombre','Legajo','Rol','Ultimo acceso','Modulo','Estado','Fecha cert','Vence','Solicitudes']];
 for(var i=0;i<users.length;i++){
  var u=users[i];
  var userProg=progress.filter(function(p){return p.usuario_id===u.id;});
  var userSols=sols.filter(function(s){return s.usuario_id===u.id;}).length;
  if(userProg.length===0){
   rows.push([u.nombre,u.legajo||'',u.rol,(u.ultimo_acceso||'').slice(0,10),'-','-','-','-',userSols]);
  }else{
   for(var j=0;j<userProg.length;j++){
    var pp=userProg[j];
    var cert=pp.certificado&&new Date(pp.fecha_vencimiento||'')>new Date();
    rows.push([u.nombre,u.legajo||'',u.rol,(u.ultimo_acceso||'').slice(0,10),pp.modulo_id,cert?'Vigente':pp.certificado?'Vencida':pp.modulos_completados&&pp.modulos_completados.length>0?'En curso':'Sin iniciar',(pp.fecha_cert||'-'),(pp.fecha_vencimiento||'-'),userSols]);
   }
  }
 }
 var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
 var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
 var url=URL.createObjectURL(blob);var a=document.createElement('a');
 a.href=url;a.download='reporte_apptus_'+(S.empresa?S.empresa.nombre:'')+'.csv';
 document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function diasRestantes(empresa){

 var fechaPago=new Date(empresa.fecha_pago);

 vence.setDate(vence.getDate()+dias);
 var restantes=Math.ceil((vence-new Date())/(1000*60*60*24));
 return{dias:restantes,vence:vence.toLocaleDateString('es-AR'),periodo:empresa.pago_periodo,vencido:restantes<0};
}

  if(e.codigo_rrhh)o+='<div style="flex:1;background:var(--card);border-radius:8px;padding:8px;text-align:center"><p style="font-size:10px;color:var(--mu)">RRHH</p><p style="font-weight:700;font-size:16px;color:var(--warn)">'+e.codigo_rrhh+'</p></div>';
  o+='</div>';
  o+='<div style="display:flex;gap:6px">';
  o+='<button class="btn btn-g" style="flex:1;margin-bottom:0;padding:8px;font-size:12px" onclick="editEmpresa(\''+e.id+'\')">Editar</button>';
  if(e.codigo){var lnk=base+'?codigo='+encodeURIComponent(e.codigo);o+='<button class="btn" style="flex:1;margin-bottom:0;padding:8px;font-size:12px;background:#1a3a6b;color:white" onclick="doShare(\''+e.codigo+'\',\''+e.nombre+'\',\''+lnk+'\')">Compartir</button>';}
  o+='</div></div>';
 }
 o+='</div>';
 return o;
}

 o+='<div class="g2"><div><label>Fecha inicio</label><input type="date" id="efecha_inicio" value="'+(e.fecha_inicio||'')+'"></div><div><label>Ultimo pago</label><input type="date" id="efecha_pago" value="'+(e.fecha_pago||'')+'"></div></div>';

function shareApp(){
 var emp=S.empresa||{};
 var base=window.location.href.split('?')[0];
 var link=base+'?codigo='+encodeURIComponent(emp.codigo||'');
 var msg='AppTus - Soporte Tecnico Operativo\n\nAccede a la plataforma:\n'+link+'\n\nCodigo: '+(emp.codigo||'')+'\nSolo necesitas tu nombre y DNI.';
 if(navigator.share){navigator.share({title:'AppTus',text:msg,url:link}).catch(function(){navigator.clipboard&&navigator.clipboard.writeText(msg).then(function(){alert('Copiado!');});});}
 else if(navigator.clipboard){navigator.clipboard.writeText(msg).then(function(){alert('Mensaje copiado al portapapeles!');}).catch(function(){prompt('Copia este mensaje:',msg);});}
 else{prompt('Copia este mensaje:',msg);}
}


function resetModProgress(){
 if(!confirm('Reiniciar el progreso de este modulo? Tus evaluaciones anteriores se borran.'))return;
 setCacheP(S.modId,{mods:[],done:false,score:null,date:null,certified:false,certDate:null,certExpiry:null});
 saveProgress(S.modId,getProg(S.modId));
 try{localStorage.setItem('at_prog_'+S.user.id,JSON.stringify(S.progress));}catch(e){}
 S.modIdx=0;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.reviewMode=false;
 render();
}


function openModPreview(modId){
 S.modId=modId;S.modIdx=0;S.slideIdx=0;
 S.zone=null;S.ak=null;S.al=null;
 S.previewMode=true;
 S.screen='module';render();
}





// ── Recovered missing handler functions ─────────────────────────────────
function newEmpresa(){S.superEditEmpresa={modulos_habilitados:[],codigo:'',telefonos_capacitacion:[]};S.superError='';S.superLoading=false;go('edit_empresa');}
function editEmpresa(id){var emps=S.superEmpresas||[];var e=null;for(var i=0;i<emps.length;i++){if(emps[i].id===id){e=emps[i];break;}}if(!e)return;S.superEditEmpresa=Object.assign({},e);S.superError='';S.superLoading=false;go('edit_empresa');}
function toggleMod(m){
 var en=document.getElementById('ename');if(en)S.superEditEmpresa.nombre=en.value;
 var ec=document.getElementById('ecode');if(ec)S.superEditEmpresa.codigo=ec.value.toUpperCase();
 var ep=document.getElementById('eplan');if(ep)S.superEditEmpresa.plan=ep.value;
 var e=S.superEditEmpresa;var mods=e.modulos_habilitados||[];
 var idx=mods.indexOf(m);if(idx>=0)mods.splice(idx,1);else mods.push(m);
 e.modulos_habilitados=mods;render();
}
function autoCode(){var nameEl=document.getElementById('ename');var codeEl=document.getElementById('ecode');if(!nameEl||!codeEl)return;if(!codeEl.value||codeEl.dataset.auto){codeEl.value=genCode(nameEl.value);codeEl.dataset.auto='1';}}
function toggleActivaEmpresa(){var e=S.superEditEmpresa;e.activa=!e.activa;render();}

// ── Fix bot step1 navigation ──────────────────────────────────────────────
// Override rBotCapacitacion to fix catKey/catIdx lookup
var _rBotCapacitacion_orig = typeof rBotCapacitacion === 'function' ? rBotCapacitacion : null;
function rBotCapacitacion(){
var CATS=getCats();
 var bs=S.botState||{step:0};
 var o='<div class="w"><button class="back" onclick="go(\'home\')">&larr; Inicio</button>';
 o+='<h2 style="font-size:18px;font-weight:500;margin-bottom:4px">Consulta rapida</h2>';
 o+='<p class="muted" style="margin-bottom:14px">Encontra el tema que buscas</p>';
 var enabledMods=(S.empresa&&S.empresa.modulos_habilitados)||[];
 var isSuperAdmin=(S.rol==='super_admin');

 if(bs.step===0){
  // Step 0: show categories
  var cats={};
  for(var ci=0;ci<CATS.length;ci++){
   var cat=CATS[ci];
   var catMods=cat.modulos.filter(function(m){return isSuperAdmin||enabledMods.indexOf(m.id)>=0;});
   if(catMods.length===0)continue;
   cats[ci]={label:cat.label,icon:cat.icon||'📋',mods:catMods,idx:ci};
  }
  o+='<div class="card"><p style="font-weight:600;margin-bottom:12px">Selecciona el area</p>';
  var catIdxs=Object.keys(cats);
  for(var ki=0;ki<catIdxs.length;ki++){
   var ci2=catIdxs[ki];var cat2=cats[ci2];
   o+='<div onclick="S.botState={step:1,catIdx:'+ci2+'};render()" class="eqli" style="cursor:pointer;margin-bottom:8px">';
   o+='<span style="font-size:28px">'+cat2.icon+'</span><div><p style="font-weight:500">'+cat2.label+'</p><p class="muted" style="font-size:12px">'+cat2.mods.length+' modulo'+(cat2.mods.length>1?'s':'')+'</p></div><span style="color:var(--mu)">&rsaquo;</span></div>';
  }
  o+='</div>';
 } else if(bs.step===1){
  // Step 1: show modules in category
  var ci3=bs.catIdx||0;
  var cat3=CATS[ci3]||{label:'',modulos:[],icon:''};
  var catMods3=cat3.modulos.filter(function(m){return isSuperAdmin||enabledMods.indexOf(m.id)>=0;});
  o+='<button class="back" onclick="S.botState={step:0};render()">&larr; '+cat3.label+'</button>';
  o+='<div class="card"><p style="font-weight:600;margin-bottom:12px">'+cat3.label+'</p>';
  for(var mi=0;mi<catMods3.length;mi++){
   var mod=catMods3[mi];
   o+='<div onclick="S.botState={step:2,catIdx:'+ci3+',modId:\''+mod.id+'\'};render()" class="eqli" style="cursor:pointer;margin-bottom:8px">';
   o+='<span style="font-size:24px">'+(mod.icon||'📋')+'</span><div><p style="font-weight:500">'+mod.label+'</p><p class="muted" style="font-size:12px">'+(mod.sub||'')+'</p></div><span style="color:var(--mu)">&rsaquo;</span></div>';
  }
  o+='</div>';
 } else if(bs.step===2){
  // Step 2: show topics in module
  var modId=bs.modId;var d=getModData(modId);
  var modInfo=null;
  for(var ci4=0;ci4<CATS.length;ci4++){for(var mi2=0;mi2<CATS[ci4].modulos.length;mi2++){if(CATS[ci4].modulos[mi2].id===modId)modInfo=CATS[ci4].modulos[mi2];}}
  var ci5=bs.catIdx||0;
  o+='<button class="back" onclick="S.botState={step:1,catIdx:'+ci5+'};render()">&larr; '+(modInfo?modInfo.label:modId)+'</button>';
  o+='<div class="card"><p style="font-weight:600;margin-bottom:12px">Selecciona el tema</p>';
  if(d&&d.mods&&d.mods.length>0){
   for(var ti=0;ti<d.mods.length;ti++){
    var topic=d.mods[ti];
    o+='<div onclick="openModAt(\''+modId+'\','+ti+')" style="display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px;cursor:pointer;border:.5px solid var(--bd)">';
    o+='<span style="font-size:20px">'+(topic.icon||'📋')+'</span><div style="flex:1"><p style="font-size:14px;font-weight:500">'+topic.title+'</p><p class="muted" style="font-size:12px">'+(topic.desc||'')+'</p></div><span style="color:var(--mu)">&rsaquo;</span></div>';
   }
  }else{o+='<p class="muted">Sin temas disponibles. Intenta sincronizar modulos.</p>';}
  o+='</div>';
 }
 o+='</div>';
 return o;
}
