const BUCKET = 'apptus-media';

function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function subirUno(path, blob, dotId) {
  const res = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': blob.type, 'x-upsert': 'true' },
    body: blob
  });
  const dot = document.getElementById(dotId);
  if (res.ok) { dot.className = 'dot ok'; return true; }
  dot.className = 'dot err';
  const text = await res.text().catch(() => '');
  document.getElementById('status').textContent += ' Error: ' + text;
  return false;
}
